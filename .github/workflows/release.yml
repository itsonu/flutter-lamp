name: Release

# Publishes one staged version at a time, at most every other day.
#
# The cron is daily on purpose: GitHub's `*/2` day-of-month skips awkwardly
# across month boundaries (the 31st is followed by the 1st). Running daily and
# enforcing the gap in the job gives a real alternate-day cadence, and a missed
# run catches up the next morning instead of waiting two more days.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily; the job enforces the ~48h gap
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Defaults to the next queue entry."
        required: false
      ignore_gap:
        description: "Release even if the last one was under 40 hours ago."
        type: boolean
        default: false

permissions:
  contents: write # create and push the tag, create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Never let a fork's schedule try to publish this package.
    if: github.repository == 'itsonu/flutter-lamp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need tags and history to pick the next version

      - name: Pick the version to release
        id: pick
        run: |
          set -euo pipefail
          requested="${{ inputs.version }}"

          if [ -n "$requested" ]; then
            version="$requested"
            commit="$(awk -v v="$requested" '$1 == v { print $2 }' .github/release-queue.txt | head -1)"
            [ -n "$commit" ] || { echo "::error::$requested is not in .github/release-queue.txt"; exit 1; }
          else
            # First queued version that is not on npm yet. Keyed on the
            # registry rather than on tags: a version can be tagged and
            # released on GitHub while the npm publish is still pending, and
            # a tag-based check would skip it forever.
            version=""
            while read -r v c; do
              case "$v" in ''|\#*) continue ;; esac
              if ! npm view "flutter-lamp@$v" version >/dev/null 2>&1; then
                version="$v"; commit="$c"; break
              fi
            done < .github/release-queue.txt
          fi

          if [ -z "$version" ]; then
            echo "::notice::Release queue is empty — nothing left to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A full 40-character hex SHA and nothing else. An abbreviation can
          # become ambiguous as the repo grows; a branch or tag name is worse,
          # because it is mutable — "release the queued commit" would quietly
          # mean "release whatever that ref points at this morning".
          case "$commit" in
            *[!0-9a-f]*) echo "::error::Queue entry for $version is '$commit', not a hex SHA"; exit 1 ;;
          esac
          if [ "${#commit}" -ne 40 ]; then
            echo "::error::Queue entry for $version is ${#commit} chars; a full 40-char SHA is required"
            exit 1
          fi

          # The commit being released is written before the queue entry naming
          # it, so its own tree does not contain that entry. Keep the branch's
          # copy, which is the authoritative one.
          cp .github/release-queue.txt "$RUNNER_TEMP/release-queue.txt"

          echo "Selected $version at $commit"
          {
            echo "skip=false"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce the alternate-day gap
        id: gap
        if: steps.pick.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ "${{ inputs.ignore_gap }}" = "true" ] || [ -n "${{ inputs.version }}" ]; then
            echo "Manual run — gap not enforced."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          last="$(git for-each-ref --sort=-creatordate --format='%(creatordate:unix)' 'refs/tags/v*' | head -1)"
          if [ -z "$last" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          hours=$(( ( $(date +%s) - last ) / 3600 ))
          # 40 rather than 48: a daily cron drifts, and a strict 48 would push
          # every other release out by a full extra day.
          if [ "$hours" -lt 40 ]; then
            echo "::notice::Last release was ${hours}h ago; waiting for the alternate-day gap."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last release was ${hours}h ago — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release commit
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        run: |
          set -euo pipefail
          expected="${{ steps.pick.outputs.commit }}"
          git checkout --detach "$expected"
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$expected" ]; then
            echo "::error::Checked out $head but the queue named $expected"
            exit 1
          fi
          echo "Standing on $head"

      - uses: actions/setup-node@v5
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify the release candidate
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        env:
          # The branch's queue, stashed before the detached checkout.
          RELEASE_QUEUE: ${{ runner.temp }}/release-queue.txt
        run: |
          npm ci
          bash scripts/verify-release.sh \
            "${{ steps.pick.outputs.version }}" \
            "${{ steps.pick.outputs.commit }}"

      - name: Tag the release
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.pick.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            at="$(git rev-list -n 1 "refs/tags/v$version")"
            if [ "$at" != "${{ steps.pick.outputs.commit }}" ]; then
              echo "::error::Tag v$version already points at $at, not the release commit"
              exit 1
            fi
            echo "Tag v$version already points here — reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Flutter Lamp v$version"
          git push origin "v$version"

      - name: Publish to npm
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        env:
          # Fallback only. With trusted publishing configured this is unset and
          # no npm credential exists anywhere — nothing to leak or rotate.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.pick.outputs.version }}"

          if npm view "flutter-lamp@$version" version >/dev/null 2>&1; then
            echo "::notice::flutter-lamp@$version is already on npm — nothing to do."
            exit 0
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN."
            npm publish --provenance --access public
            echo "Published flutter-lamp@$version (token auth)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Trusted publishing: the npm CLI exchanges the Actions OIDC token for
          # a short-lived credential. Needs npm >= 11.5.1, which is newer than
          # the version bundled with Node 22 on the runner. Provenance is
          # generated automatically, so --provenance is not passed here.
          npm install -g npm@latest >/dev/null 2>&1             || echo "::warning::Could not upgrade npm; trusted publishing needs >= 11.5.1."
          echo "npm $(npm --version), publishing via OIDC trusted publishing."

          if npm publish --access public; then
            echo "Published flutter-lamp@$version via trusted publishing (no token)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Tag and GitHub release still succeeded, so do not fail the run red on
          # a public repo. Say exactly what to configure instead.
          echo "::warning::Tagged v$version but could not publish: no NPM_TOKEN and no trusted publisher."
          {
            echo "### npm publish skipped"
            echo
            echo "\`v$version\` is tagged and released on GitHub, but npm rejected the publish."
            echo
            echo "**One-time fix — no token required.** On npmjs.com, open the"
            echo "**flutter-lamp** package → **Settings** → **Trusted Publisher** →"
            echo "**GitHub Actions**, and enter:"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Organization or user | \`itsonu\` |"
            echo "| Repository | \`flutter-lamp\` |"
            echo "| Workflow filename | \`release.yml\` |"
            echo "| Allowed actions | npm publish |"
            echo
            echo "Then re-run this workflow. Nothing else changes, and no credential"
            echo "is ever created or stored."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify what landed on npm
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.pick.outputs.version }}"

          # The registry is read-after-write eventually consistent; give it a
          # moment before concluding the publish did not happen.
          for attempt in 1 2 3 4 5; do
            if npm view "flutter-lamp@$version" version >/dev/null 2>&1; then
              published=true; break
            fi
            published=false
            sleep 10
          done

          if [ "$published" != "true" ]; then
            echo "::warning::flutter-lamp@$version is not on npm. The tag and GitHub release stand; see the publish step for what to configure."
            echo "not-published=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # It is on npm — now check it is the artifact we meant to ship.
          gitHead="$(npm view "flutter-lamp@$version" gitHead 2>/dev/null || true)"
          if [ -n "$gitHead" ] && [ "$gitHead" != "${{ steps.pick.outputs.commit }}" ]; then
            echo "::error::flutter-lamp@$version on npm was built from $gitHead, not ${{ steps.pick.outputs.commit }}"
            exit 1
          fi
          echo "Verified flutter-lamp@$version on npm${gitHead:+ (gitHead $gitHead)}." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: steps.pick.outputs.skip == 'false' && steps.gap.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.pick.outputs.version }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          # The CHANGELOG section for this version, without its own heading.
          # Literal matching, not regex: "## [0.4.0]" as a pattern would be
          # read as a character class and silently match nothing.
          awk -v tag="## [$version]" '
            index($0, tag) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "v$version" --title "v$version" --notes-file notes.md
