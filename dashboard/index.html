<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flutter Lamp — Runtime Dashboard</title>
<style>
  /*
   * System font rather than a webfont: this dashboard is served from loopback
   * by a local developer tool, and a Google Fonts <link> fails exactly when the
   * machine is offline — the case where a local tool most needs to work. The
   * platform font also ships optical sizing and tracking tables already.
   */
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128;
    /* control boundary — 3.05:1 on --panel2, clears WCAG 1.4.11 */
    --rule-strong: #666c73;
    /* structural edge — blocks, canvases, table header underline (1.76:1) */
    --border: #3d444d;
    /* separator between rows inside a block (1.33:1) — present, not counted */
    --border-soft: #2b323a;
    /* pointer feedback; distinct from --panel2, which is a surface tint */
    --hover: #232932;
    --text: #e6edf3; --text2: #b6c0cb; --muted: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* One spacing scale. Every gap below is a step on it, never an ad-hoc value. */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;

    /* Five type sizes. Tracking is size-specific: large text reads too loose as
       it grows, small caps read too tight — a single letter-spacing is wrong
       somewhere. Leading tightens as size grows. */
    --fs-metric: 20px; --fs-body: 13px; --fs-label: 12px; --fs-meta: 11px;

    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: var(--fs-body); line-height: 1.45;
    display: flex; flex-direction: column; height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome ---------------------------------------------------------- */
  /* Translucent, so content scrolls under it and the chrome reads as a layer
     above the data rather than a strip carved out of the page. */
  header {
    display: flex; align-items: center; gap: var(--s4);
    padding: var(--s2) var(--s4);
    background: rgba(22, 27, 34, 0.82);
    backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap; row-gap: var(--s2);
    position: relative; z-index: 3;
  }
  .brand { font-weight: 600; font-size: var(--fs-body); letter-spacing: -0.01em; white-space: nowrap; }
  .brand b { color: var(--accent); font-weight: 600; }

  /* The three states that are genuinely independent. One badge could never say
     "the app is gone but MCP is serving an agent", which is a real and common
     state, so there are three. */
  .chips { display: flex; gap: var(--s3); align-items: center; cursor: pointer; padding: var(--s1) var(--s2);
           border-radius: var(--radius); border: 1px solid transparent; flex-wrap: wrap; }
  .chips:hover { border-color: var(--rule-strong); background: var(--hover); }
  .chip { display: inline-flex; align-items: center; gap: 6px;
          font-size: var(--fs-meta); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .chip b { font-weight: 500; letter-spacing: 0.02em; text-transform: none; font-size: var(--fs-label); }
  .spacer { flex: 1; }
  .controls { display: flex; gap: var(--s2); flex-wrap: wrap; }

  button, select, input {
    font-family: var(--sans); font-size: var(--fs-label); color: var(--text);
    background: var(--panel2); border: 1px solid var(--rule-strong); border-radius: 6px;
    padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  /* Feedback on press, not on release — waiting for the click to land feels dead. */
  button:active { transform: scale(0.97); }
  button, .chips, .arow.clickable, .fnd.clickable { transition: transform 90ms ease-out, background-color 90ms ease-out; }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type=text] { min-width: 150px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* A heading and live-region text that exist for assistive tech only. The
     document previously started at h2 and announced nothing when the runtime
     came and went. */
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
             overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* A real button in a table cell, styled as the inline destination it already
     looked like. It was blue text with an arrow and no way to reach it. */
  button.lnk { background: none; border: none; padding: 0; color: var(--accent);
               font-family: var(--sans); font-size: var(--fs-label); }
  button.lnk:hover { border: none; text-decoration: underline; }

  nav { display: flex; gap: var(--s1); padding: 0 var(--s3); background: var(--panel);
        border-bottom: 1px solid var(--border); overflow-x: auto; position: relative; z-index: 2; }
  nav button { border: none; background: none; border-radius: 0; padding: var(--s3);
               border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap;
               font-size: var(--fs-body); }
  nav button:hover { border-color: transparent; border-bottom-color: var(--rule-strong); color: var(--text2); }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button:active { transform: none; }
  nav .badge { font-family: var(--mono); font-size: var(--fs-meta); color: var(--muted); margin-left: 6px; }
  nav .badge.alert { color: var(--red); }

  /* The browser's own scroll anchoring adjusts scrollTop when content is
     inserted above the viewport. That is the right default for a document, but
     here it fought the explicit row anchoring and silently pushed a
     following-the-newest view off the top. This code owns the behaviour. */
  main { flex: 1; overflow: auto; overflow-anchor: none; padding: var(--s6) var(--s4) var(--s8); }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .tab { display: none; } .tab.active { display: block; }

  /* ---- section rhythm -------------------------------------------------- */
  h2.sec {
    font-size: var(--fs-meta); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin: var(--s8) 0 var(--s3);
  }
  h2.sec:first-child { margin-top: 0; }
  h2.sec .hint { text-transform: none; letter-spacing: 0; font-weight: 400; opacity: .8; margin-left: var(--s2); }

  /* Containers are reserved for the places that genuinely group something.
     Everything else is a row or a table. */
  .block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  /* ---- status vocabulary (one set of names, used on every view) --------- */
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-meta);
        letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .s-ok { color: var(--green); }
  .s-recv { color: var(--accent); }
  .s-warn { color: var(--yellow); }
  .s-err { color: var(--red); }
  .s-idle { color: var(--muted); }
  .s-na { color: var(--muted); }
  .s-na::before { background: none; box-shadow: inset 0 0 0 1px currentColor; }

  /* ---- status rows ----------------------------------------------------- */
  .srow { display: grid; grid-template-columns: 168px 124px 1fr; gap: var(--s3);
          align-items: baseline; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--border-soft); }
  .srow:last-child { border-bottom: none; }
  .srow .n { color: var(--text); font-weight: 500; }
  .srow .w { color: var(--muted); font-size: var(--fs-label); }
  .srow .w code, .srow .w b { font-family: var(--mono); color: var(--text2); font-weight: 400; }
  .srow.head { border-bottom: 1px solid var(--border); }
  .srow.head .n { font-weight: 600; }

  /* ---- metric strip (replaces six equal cards) ------------------------- */
  .stats { display: flex; flex-wrap: wrap; gap: var(--s6) var(--s8); padding: var(--s4); }
  .stat { min-width: 92px; }
  .stat .k { font-size: var(--fs-meta); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: var(--fs-metric); line-height: 1.1; letter-spacing: -0.02em;
             margin-top: var(--s1); color: var(--text); }
  .stat .v.none { font-family: var(--sans); font-size: var(--fs-body); letter-spacing: 0; color: var(--muted); line-height: 1.5; }
  .stat .s { font-size: var(--fs-meta); color: var(--muted); margin-top: 2px; }

  /* ---- findings -------------------------------------------------------- */
  .fnd { display: grid; grid-template-columns: 18px 1fr auto; gap: var(--s3);
         padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border-soft); align-items: start; }
  .fnd:last-child { border-bottom: none; }
  .fnd.clickable { cursor: pointer; }
  .fnd.clickable:hover { background: var(--hover); }
  .fnd .mk { font-size: var(--fs-body); line-height: 1.4; }
  .fnd .ttl { font-weight: 500; }
  .fnd .why { color: var(--muted); font-size: var(--fs-label); margin-top: 2px; }
  .fnd .ev { color: var(--text2); font-size: var(--fs-label); font-family: var(--mono); margin-top: var(--s1); word-break: break-word; }
  .fnd .go { color: var(--accent); font-size: var(--fs-meta); white-space: nowrap; padding-top: 3px; }
  .f-err .mk { color: var(--red); } .f-warn .mk { color: var(--yellow); }
  .f-blind .mk { color: var(--muted); } .f-ok .mk { color: var(--green); }

  /* ---- activity stream ------------------------------------------------- */
  .filters { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; margin-bottom: var(--s3); }
  /* The first four chips scope the source; the rest pick a category. A gap says
     so without a divider, a heading, or a second colour. */
  .fbtn.group-2 { margin-left: var(--s4); }
  #aq { margin-left: var(--s4); }
  .arow { display: grid; grid-template-columns: 92px 76px 1fr auto; gap: var(--s3);
          padding: 5px var(--s3); border-bottom: 1px solid var(--border-soft); align-items: baseline;
          font-size: var(--fs-label); }
  .arow.clickable { cursor: pointer; }
  .arow.clickable:hover { background: var(--hover); }
  .arow.clickable:focus-visible { outline-offset: -2px; }
  .fnd.clickable:focus-visible { outline-offset: -2px; }
  .arow .ts { font-family: var(--mono); color: var(--muted); font-size: var(--fs-meta); }
  .arow .src { font-size: var(--fs-meta); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .arow .msg { font-family: var(--mono); word-break: break-word; color: var(--text2); }
  .arow .meta { font-family: var(--mono); font-size: var(--fs-meta); color: var(--muted); white-space: nowrap; }
  .arow.sev-error .msg, .arow.sev-critical .msg { color: #ffa198; }
  .arow.sev-warning .msg { color: #e3b341; }
  .detail { background: var(--panel2); border-radius: 6px; padding: var(--s3);
            margin: var(--s2) var(--s3); white-space: pre-wrap; word-break: break-word;
            color: var(--muted); font-family: var(--mono); font-size: var(--fs-label); }
  .detail b { color: var(--text); font-weight: 500; }
  .detail .stack { color: #ffa198; }

  /* ---- tables ---------------------------------------------------------- */
  /* Pinned-stream affordance. Sticky rather than fixed so it belongs to the
     view it controls, and it exists only while the stream is actually pinned. */
  .jump { position: sticky; bottom: var(--s3); display: flex; justify-content: center;
          margin-top: var(--s3); pointer-events: none; }
  .jump button { pointer-events: auto; background: var(--panel2); border-color: var(--accent);
                 color: var(--accent); box-shadow: 0 4px 16px rgba(0,0,0,.4); }

  .scroll-x { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-label); }
  table.tbl th { text-align: left; color: var(--muted); font-weight: 500; font-size: var(--fs-meta);
                 text-transform: uppercase; letter-spacing: 0.06em; padding: var(--s2) var(--s3);
                 border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.tbl td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border-soft);
                 font-family: var(--mono); white-space: nowrap; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl td.name { color: var(--text); }
  table.tbl td.num, table.tbl th.num { text-align: right; }
  table.tbl tr.clickable { cursor: pointer; }
  table.tbl tr.clickable:hover td { background: var(--hover); }
  table.tbl td.bad { color: var(--red); }
  table.tbl td.good { color: var(--green); }

  canvas { width: 100%; height: 180px; background: var(--panel); border: 1px solid var(--border);
           border-radius: var(--radius); display: block; }
  .empty { color: var(--muted); padding: var(--s8) var(--s4); text-align: center; font-size: var(--fs-label); line-height: 1.6; }
  .empty b { color: var(--text2); font-weight: 500; }
  .note { color: var(--muted); font-size: var(--fs-label); margin-top: var(--s3); line-height: 1.55; }
  .note b { color: var(--text2); font-weight: 500; }
  code { font-family: var(--mono); color: var(--text2); }

  /* ---- responsive ------------------------------------------------------ */
  /* The explanation column carries the meaning; it must never be squeezed to a
     sliver, so below this width the rows stack instead of holding a grid. */
  @media (max-width: 620px) {
    nav button { padding: var(--s3) var(--s2); }
    nav .badge { margin-left: var(--s1); }
  }
  @media (max-width: 760px) {
    .srow { grid-template-columns: 1fr; gap: var(--s1); padding: var(--s3); }
    .arow { grid-template-columns: 80px 1fr; }
    .arow .src, .arow .meta { grid-column: 2; }
    /* The message is the content. Leaving it in the 80px column while the word
       "SYSTEM" took 278px made rows 179px tall and the text unreadable — the
       inverse of the squeeze this breakpoint exists to prevent. */
    .arow .msg { grid-column: 1 / -1; }
    .stats { gap: var(--s4) var(--s6); }
    main { padding: var(--s4) var(--s3) var(--s8); }
  }

  /* ---- user preferences ------------------------------------------------ */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    button:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--panel); backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --muted: #aab4bf; --rule-strong: #8b949e; --border: #6a7077;
            --border-soft: #4a525c; --hover: #2b323a; }
    header { background: var(--panel); backdrop-filter: none; }
  }
</style>
</head>
<body>
<h1 class="sr-only">Flutter Lamp runtime dashboard</h1>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<header>
  <div class="brand">Flutter <b>Lamp</b></div>
  <div class="chips" id="chips" role="button" tabindex="0" title="Open Diagnostics"></div>
  <div class="spacer"></div>
  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="clearBtn" title="Empties this browser's buffer only. The server's store is untouched — reload to restore whatever it still retains.">Clear view</button>
    <button id="exportBtn" title="Downloads the runtime events held in this browser only — not MCP tool telemetry, diagnoses or anything already evicted. The full session export is the export_session MCP tool.">Export events</button>
  </div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"><div class="wrap" id="wrap"></div></main>

<script>
(() => {
  // Four destinations, one per question the audit found had no home:
  // what is happening · show me the events · is rendering healthy ·
  // what is actually wired up. Logs/Network/Exceptions/Timeline/MCP were nine
  // peers with no hierarchy; three of them rendered the same empty sentence.
  const TABS = ["Overview","Activity","Performance","Diagnostics"];
  const CAP = 5000;
  const state = {
    events: [], status: { connected: false, isolateId: null, wsUri: null },
    telemetry: null, paused: false, active: "Overview",
    expanded: new Set(), filter: "all", query: "",
    // Pinned vs following the newest entry, and when the reader pinned it.
    following: true, followFrom: null,
    // Roving-tabindex cursor for the activity list: the id of the one row that
    // is a tab stop. 400 individually tabbable rows would be a tab-stop
    // nightmare; one stop plus arrow keys is the standard list pattern.
    cursor: null,
    // When the view was paused, and how many entries arrived since.
    pausedAt: null, pausedCount: 0,
    wsState: "connecting", booted: false,
    lastEventAt: null, lastMessageAt: null,
  };
  let dirty = true, socket = null, backoff = 1000;

  // ---- DOM scaffolding ----
  const nav = document.getElementById("tabs");
  const wrap = document.getElementById("wrap");
  const main = document.getElementById("main");
  const panels = {};
  TABS.forEach(name => {
    const b = document.createElement("button");
    b.dataset.tab = name;
    b.setAttribute("role", "tab");
    b.id = "tabbtn-" + name;
    b.setAttribute("aria-controls", "tab-" + name);
    b.innerHTML = name + ' <span class="badge" id="badge-'+name+'"></span>';
    b.onclick = () => setTab(name);
    nav.appendChild(b);
    const p = document.createElement("section");
    p.className = "tab"; p.id = "tab-" + name;
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", "tabbtn-" + name);
    wrap.appendChild(p); panels[name] = p;
  });
  /**
   * Tab, filter and search live in the location hash.
   *
   * Two things fall out of that, both free. A filtered view can be reloaded,
   * bookmarked or pasted to someone else — for a tool kept open beside an
   * editor for hours that was the cheapest efficiency win left. And a
   * drill-through pushes a history entry, so the browser's own Back button
   * reverses it; a bespoke back control would be a second, less familiar way to
   * do something every user already knows how to do.
   */
  function syncUrl(mode){
    if (mode === "none") return;
    const parts = [state.active];
    // Filter and search only mean something on Activity. Carrying them into
    // #Overview/system would imply Overview is filtered, which it is not.
    if (state.active === "Activity") {
      if (state.filter !== "all" || state.query) parts.push(state.filter);
      if (state.query) parts.push(encodeURIComponent(state.query));
    }
    const hash = "#" + parts.join("/");
    if (hash === location.hash) return;
    history[mode === "push" ? "pushState" : "replaceState"](null, "", hash);
  }

  /** Read the hash into state and return the tab it names. */
  function applyUrl(){
    // Each segment is decoded on its own: decoding the whole string first would
    // turn an encoded slash inside the search term into a segment separator.
    const raw = location.hash.replace(/^#/, "").split("/");
    const tab = TABS.includes(raw[0]) ? raw[0] : "Overview";
    // A hash naming a filter for another tab is ignored rather than applied.
    const named = tab === "Activity" && raw[1] && FILTERS.some(([k]) => k === raw[1]);
    state.filter = named ? raw[1] : "all";
    state.query = named && raw[2] ? decodeURIComponent(raw[2]) : "";
    state.cursor = null;
    return tab;
  }

  window.addEventListener("popstate", () => setTab(applyUrl(), "none"));

  function setTab(name, mode){
    state.active = name; dirty = true;
    [...nav.children].forEach(c => {
      const on = c.dataset.tab === name;
      c.classList.toggle("active", on);
      c.setAttribute("aria-selected", String(on));
      // Roving tabindex: the tablist is one tab stop, arrows move within it.
      c.tabIndex = on ? 0 : -1;
    });
    Object.entries(panels).forEach(([n,p]) => p.classList.toggle("active", n===name));
    main.scrollTop = 0;
    syncUrl(mode || "replace");
    render();
  }

  // Arrow-key movement inside the tablist, per the tabs pattern. Without it a
  // roving tabindex would trap the keyboard on whichever tab was active.
  nav.addEventListener("keydown", (e) => {
    const keys = { ArrowRight: 1, ArrowLeft: -1, Home: 0, End: 0 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    const i = TABS.indexOf(state.active);
    const n = e.key === "Home" ? 0 : e.key === "End" ? TABS.length - 1
            : (i + keys[e.key] + TABS.length) % TABS.length;
    setTab(TABS[n]);
    nav.children[n].focus();
  });

  // ---- controls ----
  const pauseBtn = document.getElementById("pauseBtn");
  pauseBtn.onclick = () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? "Resume" : "Pause";
    pauseBtn.setAttribute("aria-pressed", String(state.paused));
    pauseBtn.classList.toggle("on", state.paused);
    // Pause is a VIEW control. Collection continues, and the browser's own
    // buffer keeps filling and trimming, so the count of what arrived while
    // frozen is the honest thing to show on resume.
    state.pausedAt = state.paused ? Date.now() : null;
    state.pausedCount = 0;
    // One render at the moment of pausing, so the frozen view shows that it is
    // frozen. After that only the header keeps moving.
    dirty = true; render();
  };
  pauseBtn.setAttribute("aria-pressed", "false");
  document.getElementById("clearBtn").onclick = () => {
    // View-only: the server's store is untouched and a reload restores what it
    // still retains. Saying so is cheaper than a confirmation dialog.
    state.events = []; state.expanded.clear(); state.cursor = null; state.cleared = Date.now();
    dirty = true; render();
  };
  document.getElementById("exportBtn").onclick = () => {
    // Scope, stated where it is chosen rather than only in a tooltip: this is
    // the browser's own buffer, not the session.
    const blob = new Blob([JSON.stringify(state.events, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "flutter-runtime-" + Date.now() + ".json"; a.click(); URL.revokeObjectURL(a.href);
  };
  const chips = document.getElementById("chips");
  chips.onclick = () => setTab("Diagnostics");
  chips.onkeydown = (e) => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setTab("Diagnostics"); } };

  // ---- websocket + auto reconnect ----
  function connect(){
    const proto = location.protocol === "https:" ? "wss" : "ws";
    // The server inlines a per-process token into this page; the WebSocket
    // handshake requires it, so a cross-origin tab cannot open the stream.
    const token = encodeURIComponent(window.__LAMP_TOKEN__ || "");
    socket = new WebSocket(proto + "://" + location.host + "/ws?t=" + token);
    socket.onopen = () => { backoff = 1000; state.wsState = "open"; dirty = true; };
    socket.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      state.lastMessageAt = Date.now();
      state.booted = true;
      if (msg.type === "snapshot") {
        state.events = msg.events || [];
        state.status = msg.status;
        state.telemetry = msg.telemetry || null;
        // Seeded from the snapshot, not left null. Reporting "last event never"
        // beside a list of events was a factual bug in the one row that
        // certifies the stream works.
        const last = state.events[state.events.length - 1];
        if (last) state.lastEventAt = last.timestamp;
      }
      else if (msg.type === "event") {
        if (state.paused) state.pausedCount++;
        state.events.push(msg.event);
        if (state.events.length > CAP) state.events.splice(0, state.events.length - CAP);
        state.lastEventAt = msg.event.timestamp;
      }
      else if (msg.type === "status") state.status = msg.status;
      else if (msg.type === "telemetry") state.telemetry = msg.telemetry;
      else if (msg.type === "cleared") { state.events = []; state.lastEventAt = null; }
      dirty = true;
    };
    socket.onclose = () => {
      state.wsState = "closed"; dirty = true;
      setTimeout(connect, backoff); backoff = Math.min(backoff*1.7, 10000);
    };
    socket.onerror = () => socket.close();
  }

  // ---- helpers ----
  const byCat = (c) => state.events.filter(e => e.category === c);
  const fmtTime = (ts) => { const d = new Date(ts); return d.toLocaleTimeString([], {hour12:false}) + "." + String(d.getMilliseconds()).padStart(3,"0"); };
  const esc = (s) => String(s==null?"":s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const fmtBytes = (n) => n < 1024 ? n+" B" : n < 1048576 ? (n/1024).toFixed(1)+" kB" : (n/1048576).toFixed(2)+" MB";
  const ago = (ts) => { if(ts==null) return "never";
    const s = Math.max(0, Math.round((Date.now()-ts)/1000));
    return s < 60 ? s+"s ago" : s < 3600 ? Math.round(s/60)+"m ago" : Math.round(s/3600)+"h ago"; };
  const dur = (ms) => { const s = Math.max(0, Math.round(ms/1000));
    return s < 60 ? s+"s" : s < 3600 ? Math.floor(s/60)+"m "+(s%60)+"s" : Math.floor(s/3600)+"h "+Math.round(s%3600/60)+"m"; };
  const st = (cls, text) => '<span class="st s-'+cls+'">'+text+'</span>';
  // The collector stamps `janky` itself; re-deriving it here would let the
  // dashboard and the diagnosis engine disagree about the same frame.
  const isJanky = (e) => e.data.janky === true;
  const JANK_BUDGET_MS = 16.7; // the fixed 60fps budget the collector applies

  const CATEGORY_COLLECTOR = { log:"logs", exception:"exceptions", frame:"frames", network:"network",
    navigation:"navigation", rebuild:"rebuilds", state:"state" };
  function collectorFor(category){
    const t = state.telemetry; if(!t) return null;
    return t.collectors.find(c => c.name === CATEGORY_COLLECTOR[category]) || null;
  }

  // ---- render loop ----
  // While paused the content is deliberately frozen, but the header must not be:
  // it is the only thing that can still say the stream is alive and how much has
  // arrived behind the frozen view.
  function loop(){
    if (state.paused) { renderChips(); return; }
    if (dirty) { render(); dirty = false; }
  }
  setInterval(loop, 200);
  // Relative times ("3s ago") go stale with no event to trigger a redraw — but
  // only two views show them. Activity shows absolute timestamps, so ticking it
  // every second rebuilt a 400-row list for nothing and threw away the caret
  // and the reader's scroll position each time.
  setInterval(() => { if (state.active === "Overview" || state.active === "Diagnostics") dirty = true; }, 1000);

  /**
   * Keep the reader's place across a re-render.
   *
   * Measured before this existed: with the app producing frames, the row a
   * reader was looking at moved 2,416px down the page in six seconds. New
   * entries are prepended, so every arrival pushes what is being read further
   * away. Scroll position alone is not the anchor — the row is.
   *
   * The same capture restores the search caret, which was being reset to the
   * end of the string on every keystroke because the input node is rebuilt.
   */
  function captureAnchor(){
    if (state.active !== "Activity") return null;
    const a = panels.Activity, q = a.querySelector("#aq");
    const input = (q && document.activeElement === q) ? { start: q.selectionStart, end: q.selectionEnd } : null;
    const active = document.activeElement;
    const focusRow = active && active.classList && active.classList.contains("arow") ? active.dataset.x : null;
    let anchor = null;
    if (!state.following) {
      for (const r of a.querySelectorAll(".arow")) {
        const y = r.getBoundingClientRect().top;
        if (y >= 0) { anchor = { id: r.dataset.x, offset: y }; break; }
      }
    }
    return { input, anchor, focusRow };
  }
  function restoreAnchor(cap){
    if (!cap) return;
    const a = panels.Activity;
    if (cap.input) {
      const q = a.querySelector("#aq");
      // Restore the exact selection, not the end of the string: forcing the
      // caret to the end made it impossible to correct a typo mid-word.
      if (q) { q.focus(); q.setSelectionRange(cap.input.start, cap.input.end); }
    }
    if (cap.anchor) {
      const el = a.querySelector('.arow[data-x="' + CSS.escape(cap.anchor.id) + '"]');
      if (el) main.scrollTop += el.getBoundingClientRect().top - cap.anchor.offset;
    }
    if (cap.focusRow) {
      const el = a.querySelector('.arow[data-x="' + CSS.escape(cap.focusRow) + '"]');
      if (el) el.focus({ preventScroll: true });
    }
  }

  // Following = pinned to the newest entry. Scrolling away stops the stream
  // moving under you; scrolling back to the top resumes following. This is how
  // a console behaves, which is the behaviour people already expect.
  main.addEventListener("scroll", () => {
    if (state.active !== "Activity") return;
    const atTop = main.scrollTop < 40;
    if (atTop === state.following) return;
    state.following = atTop;
    state.followFrom = atTop ? null : Date.now();
    dirty = true;
  }, { passive: true });

  // One polite announcement when a state a human would care about flips. A
  // streaming log that announces every row would be unusable; silence when the
  // runtime disappears is worse.
  let lastAnnounced = "";
  function announce(){
    const sys = systemState();
    const now = sys.runtime.label + "|" + sys.mcp.label + "|" + sys.stream.label + "|" + (state.paused ? "P" : "");
    if (now === lastAnnounced) return;
    lastAnnounced = now;
    const el = document.getElementById("live");
    if (el) el.textContent = "Runtime " + sys.runtime.label.toLowerCase() +
      ", MCP " + sys.mcp.label.toLowerCase() + ", stream " + sys.stream.label.toLowerCase() +
      (state.paused ? ", view paused" : "");
  }

  function render(){
    const cap = captureAnchor();
    renderChips();
    announce();
    const t = state.telemetry;
    const impaired = t && state.status.connected ? t.collectors.filter(c => c.status !== "active").length : 0;
    const att = attention();
    const bad = att.filter(f => f.sev === "err" || f.sev === "warn").length;
    const jank = byCat("frame").filter(isJanky).length;
    // Four badges previously carried three different meanings with nothing
    // saying which. The number is kept — it is genuinely useful — and each one
    // now names itself to the pointer and to assistive tech.
    const counts = {
      Overview:    [bad,                    bad === 1 ? "finding" : "findings"],
      Activity:    [state.events.length,     "events in view"],
      Performance: [jank,                    "frames over budget"],
      Diagnostics: [impaired,                impaired === 1 ? "collector impaired" : "collectors impaired"],
    };
    TABS.forEach(n => { const b = document.getElementById("badge-"+n); if(!b) return;
      const [v, noun] = counts[n];
      b.textContent = v ? v.toLocaleString() : "";
      b.title = v ? v.toLocaleString() + " " + noun : "";
      if (v) b.setAttribute("aria-label", v.toLocaleString() + " " + noun);
      else b.removeAttribute("aria-label");
      b.classList.toggle("alert", (n==="Overview" && bad>0) || (n==="Diagnostics" && impaired>0));
    });
    ({ Overview: renderOverview, Activity: renderActivity,
       Performance: renderPerformance, Diagnostics: renderDiagnostics }[state.active])(panels[state.active]);
    restoreAnchor(cap);
  }

  // ---- system state ------------------------------------------------------
  // Five states that vary independently. Collapsing them into one badge is what
  // made the old header say "app not connected" while MCP served 239 calls.
  function systemState(){
    const s = state.status, t = state.telemetry;
    const cost = t ? t.mcp.cost : null;
    return {
      runtime: s.connected
        ? { cls:"ok", label:"CONNECTED", why:"isolate <code>"+esc(s.isolateId||"?")+"</code>" +
            (s.clockOffsetMs!=null ? " · VM clock offset <code>"+s.clockOffsetMs+"ms</code>" : "") }
        : s.reconnecting
          ? { cls:"warn", label:"RECONNECTING", why:"attempt "+(s.reconnectAttempt||1)+" — the VM Service is not answering yet" }
          : { cls:"err", label:"DISCONNECTED", why:"no Flutter app attached — call <code>connect_vm</code>" },
      vm: s.connected
        ? { cls:"ok", label:"REACHABLE", why:"streams subscribed" }
        : { cls:"na", label:"UNREACHABLE", why:"nothing to subscribe to while the app is gone" },
      mcp: t
        ? { cls:"ok", label:"ACTIVE", why:"pid <code>"+t.server.pid+"</code> · v"+esc(t.server.version)+
            " · up "+dur(Date.now()-t.server.startedAt)+" — it hosts this page, so it cannot report otherwise" }
        : { cls:"idle", label:"UNKNOWN", why:"no telemetry received from the server yet" },
      agent: t && t.mcp.client
        ? { cls:"ok", label:"CONNECTED",
            why:"<b>"+esc(t.mcp.client.name)+"</b>"+(t.mcp.client.version ? " v"+esc(t.mcp.client.version) : "")+
                " · handshake "+ago(t.mcp.client.initializedAt)+" — self-reported, not authenticated" }
        : { cls:"idle", label:"NONE", why:"no MCP client has completed the handshake" },
      tools: cost
        ? (cost.calls === 0
            ? { cls:"idle", label:"NO CALLS", why:"the agent has not invoked a tool this session" }
            : cost.errors
              ? { cls:"warn", label:"FAILING", why:cost.errors+" of "+cost.calls+" calls returned an error" }
              : { cls:"recv", label:"HEALTHY", why:cost.calls+" calls · no errors · last "+
                  ago(cost.recent.length?cost.recent[0].at:null) })
        : { cls:"idle", label:"UNKNOWN", why:"no telemetry yet" },
      stream: state.wsState === "open"
        ? { cls:"recv", label:"RECEIVING", why:"last event "+ago(state.lastEventAt)+" · last server message "+ago(state.lastMessageAt) }
        : { cls:"err", label:"DISCONNECTED", why:"the dashboard WebSocket closed — retrying" },
    };
  }

  function renderChips(){
    const sys = systemState();
    chips.innerHTML =
      '<span class="chip">Runtime '+st(sys.runtime.cls, '<b>'+sys.runtime.label.toLowerCase()+'</b>')+'</span>' +
      '<span class="chip">MCP '+st(sys.mcp.cls, '<b>'+sys.mcp.label.toLowerCase()+'</b>')+'</span>' +
      '<span class="chip">Stream '+st(sys.stream.cls, '<b>'+sys.stream.label.toLowerCase()+'</b>')+'</span>' +
      (state.paused
        ? '<span class="chip">View '+st("warn", "<b>paused</b>")+
          (state.pausedCount ? ' <b>+'+state.pausedCount.toLocaleString()+' behind</b>' : '')+'</span>'
        : "");
  }

  /** What the view is doing, which is not what the stream is doing. */
  function viewState(){
    return state.paused
      ? { cls:"warn", label:"PAUSED",
          why:"frozen at <code>"+fmtTime(state.pausedAt || Date.now())+"</code> — collection continues; " +
              state.pausedCount.toLocaleString()+" entr"+(state.pausedCount===1?"y has":"ies have")+
              " arrived since. The browser buffer holds "+CAP.toLocaleString()+" entries and trims oldest-first, " +
              "so a long enough pause does lose some here." }
      : { cls:"ok", label:"LIVE", why:"following the stream" };
  }

  // ---- derived analysis --------------------------------------------------
  /**
   * Which tools fail and which never do.
   *
   * The per-tool counts already separate them exactly: on a disconnected target
   * every runtime-dependent tool fails and every tool that does not touch the
   * runtime has zero errors. That partition is the evidence — no extra
   * instrumentation is needed to say something useful about it. What is NOT
   * recorded is each call's failure reason, so the relationship stays a
   * correlation and is labelled as one wherever it is shown.
   */
  function toolPartition(){
    const t = state.telemetry;
    if(!t || !t.mcp.cost.calls) return null;
    const tools = t.mcp.cost.byTool;
    const clean = tools.filter(x => x.errors === 0);
    const failing = tools.filter(x => x.errors > 0);
    const sum = (a, k) => a.reduce((n, x) => n + x[k], 0);
    return { clean, failing,
      cleanCalls: sum(clean,"calls"), failCalls: sum(failing,"calls"),
      errors: sum(failing,"errors"), calls: t.mcp.cost.calls };
  }

  function frameStats(){
    const f = byCat("frame"); if(!f.length) return null;
    const ms = f.map(e => e.data.elapsedMs || 0).sort((a,b) => a-b);
    const pct = (p) => ms[Math.min(ms.length-1, Math.floor(ms.length * p))];
    return { n: f.length, p50: pct(.5), p95: pct(.95), p99: pct(.99), max: ms[ms.length-1],
             janky: f.filter(isJanky).length,
             worst: f.slice().sort((a,b) => b.data.elapsedMs - a.data.elapsedMs).slice(0,6) };
  }

  function memEvent(){ const m = byCat("system").filter(e=>e.data && e.data.heapUsageMB!=null); return m.length ? m[m.length-1] : null; }

  /**
   * What needs attention, with the evidence behind it.
   *
   * Every entry is derived from events or telemetry actually present. Blind
   * spots and dropped history are entries of their own: an empty view that
   * nothing could have filled must not read as clean.
   */
  function attention(){
    const out = [], t = state.telemetry, s = state.status;
    const push = (sev, mk, title, why, ev, action) => out.push({sev, mk, title, why, ev, action});

    if (!s.connected) {
      const gaveUp = state.events.some(e => e.category==="system" && /Gave up reconnecting/.test(e.message));
      const diag = state.events.filter(e => e.category==="system" && /^Why the VM Service/.test(e.message)).pop();
      // The diagnosis event carries concrete transport remedies in data.transport.
      // Surface them verbatim — never synthesise a remediation step.
      const remedy = diag && Array.isArray(diag.data && diag.data.transport) ? diag.data.transport : null;
      // "Never attached" and "was attached and lost" are different situations
      // and lead to different next actions. The store says which: a connect
      // event exists only in the second.
      const wasAttached = state.events.some(e => e.category==="system" && /^(Connected|Reconnected) to VM Service/.test(e.message));
      push("err", "●", wasAttached ? "Flutter app disconnected" : "No Flutter app is attached",
        gaveUp ? "Reconnection was attempted and abandoned. Nothing new can be observed until connect_vm runs against a fresh URI."
               : s.reconnecting ? "A reconnect is in flight — attempt " + (s.reconnectAttempt||1) + "."
               : wasAttached ? "The connection was lost. Evidence already captured stays available; nothing new arrives."
               : "Nothing has been observed this session. Call connect_vm to attach one.",
        remedy ? remedy.map(esc).join("<br/>") : diag ? esc(diag.message) : null,
        { tab:"Activity", filter:"system" });
    }

    const p = toolPartition();
    if (p && p.errors) {
      // Only claim the runtime explains the failures when the partition is
      // clean AND the runtime is actually gone. Otherwise state the count.
      const explained = !s.connected && p.clean.length > 0 && p.failing.length > 0;
      push("warn", "▲", p.errors + " of " + p.calls + " MCP tool calls failed",
        explained
          ? "MCP itself is operational. Failures are confined to the " + p.failing.length +
            " tools that read the runtime; the " + p.clean.length + " that do not have never failed."
          : "Failures are spread across " + p.failing.length + " tool" + (p.failing.length>1?"s":"") + ".",
        explained
          ? esc(p.clean.map(x=>x.tool).join(", ")) + " — 0 errors in " + p.cleanCalls + " calls<br/>" +
            esc(p.failing.map(x=>x.tool).join(", ")) + " — " + p.errors + " errors in " + p.failCalls + " calls"
          : esc(p.failing.map(x=>x.tool+" "+x.errors+"/"+x.calls).join(" · ")),
        { tab:"Diagnostics" });
      if (explained)
        push("blind", "○", "That link is a correlation, not a proven cause",
          "The failure reason is not recorded per call, so the runtime being unavailable explains the pattern but has not been demonstrated.",
          null, null);
      if (explained) out[out.length - 1].pinTo = out.length - 2;
    }

    const fs = frameStats();
    if (fs && fs.janky) {
      const pctJank = Math.round(fs.janky / fs.n * 100);
      push(pctJank >= 10 ? "warn" : "blind", pctJank >= 10 ? "▲" : "○",
        fs.janky + " of " + fs.n + " frames over budget (" + pctJank + "%)",
        "Measured against a fixed " + JANK_BUDGET_MS + "ms budget (60fps)." +
          (fs.p50 < 10 ? " This target's median frame is " + fs.p50.toFixed(1) + "ms, which suggests a faster display — so this count is conservative." : ""),
        "p95 " + fs.p95.toFixed(1) + "ms · p99 " + fs.p99.toFixed(1) + "ms · max " + fs.max.toFixed(1) + "ms",
        { tab:"Performance" });
    }

    const sig = new Map();
    byCat("exception").forEach(e => { const k = e.message.slice(0,90); sig.set(k, (sig.get(k)||0)+1); });
    [...sig.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([k,n]) =>
      push("err", "●", (n>1 ? n+"× " : "") + k, "Captured from the Flutter framework's error reporting.", null,
        { tab:"Activity", filter:"exception", query:k.slice(0,40) }));

    const net = byCat("network"), failed = net.filter(e => e.data.error || (e.data.statusCode||0) >= 400);
    if (failed.length)
      push("err", "●", failed.length + " of " + net.length + " HTTP requests failed",
        "Status 400 or above, or a transport error.", null, { tab:"Activity", filter:"network" });

    if (t) {
      if (s.connected) t.collectors.filter(c => c.status !== "active").forEach(c =>
        push("blind", "○", c.name + " is " + c.status,
          "An empty " + c.name + " view proves nothing on this target.", esc(c.detail||""), { tab:"Diagnostics" }));
      const ev = Object.values(t.retention.evicted).reduce((a,b)=>a+b,0);
      if (ev)
        push("blind", "○", ev.toLocaleString() + " events dropped",
          "The ring buffer filled, so history before that point is gone.", null, { tab:"Diagnostics" });
    }
    // Most severe first. A caveat that qualifies the finding above it has to
    // stay attached to it, so it inherits that finding's rank rather than
    // sinking to the bottom of the list.
    const RANK = { err: 0, warn: 1, blind: 2, ok: 3 };
    return out
      .map((f, i) => ({ f, i, rank: f.pinTo != null ? out[f.pinTo].sev : f.sev }))
      .sort((a, b) => (RANK[a.rank] - RANK[b.rank]) || (a.i - b.i))
      .map((x) => x.f);
  }

  /** The one-line reason behind {@link emptyKind}, for a stat's sub-label. */
  function collectorWhy(category){
    if (!state.status.connected) return "requires a connected app";
    const c = collectorFor(category);
    return c && c.detail ? c.detail.split(".")[0] : "not observable on this target";
  }

  /** Which flavour of "nothing here" applies to a category. */
  function emptyKind(category){
    if (!state.status.connected) return "not connected";
    const c = collectorFor(category);
    if (c && c.status === "unavailable") return "unobservable on this target";
    if (c && c.status === "degraded") return "partially observable";
    return "0 observed";
  }

  // ---- Overview ----------------------------------------------------------
  function renderOverview(p){
    if (!state.booted) { p.innerHTML = '<div class="block"><div class="empty">Connecting to the dashboard stream…</div></div>'; return; }
    const s = state.status, t = state.telemetry, sys = systemState();
    const att = attention();
    const bad = att.filter(f => f.sev === "err").length;
    const warn = att.filter(f => f.sev === "warn").length;
    const health = bad ? ["err","NEEDS ATTENTION"] : warn ? ["warn","DEGRADED"] : ["ok","HEALTHY"];
    const row = (n, x, w) => '<div class="srow"><span class="n">'+n+'</span>'+st(x.cls,x.label)+'<span class="w">'+(w!=null?w:x.why)+'</span></div>';

    let h = '<h2 class="sec">System</h2><div class="block">';
    h += '<div class="srow head"><span class="n">Overall</span>' + st(health[0], health[1]) +
         '<span class="w">' + (att.length ? att.length + " finding" + (att.length>1?"s":"") + " below"
                                          : "nothing abnormal in what is observable") + '</span></div>';
    h += row("Flutter app", sys.runtime) + row("VM Service", sys.vm) + row("MCP server", sys.mcp) +
         row("Agent", sys.agent) + row("Tool execution", sys.tools) + row("Dashboard stream", sys.stream);
    // The stream and the viewport are separate facts. Only shown while paused,
    // because a permanent "VIEW: LIVE" row is a badge that can never be false.
    if (state.paused) h += row("This view", viewState());
    h += '</div>';

    h += '<h2 class="sec">Attention</h2>';
    h += att.length ? '<div class="block">' + att.map((f,i) =>
        '<div class="fnd f-'+f.sev+(f.action?' clickable':'')+'" data-a="'+i+'"' +
        (f.action ? ' role="button" tabindex="0"' : '') + '>' +
        '<span class="mk">'+f.mk+'</span><span><span class="ttl">'+esc(f.title)+'</span>' +
        (f.why ? '<div class="why">'+esc(f.why)+'</div>' : '') +
        (f.ev ? '<div class="ev">'+f.ev+'</div>' : '') + '</span>' +
        (f.action ? '<span class="go">'+f.action.tab+' →</span>' : '<span></span>') + '</div>').join("") + '</div>'
      : '<div class="block"><div class="fnd f-ok"><span class="mk">✓</span><span class="ttl">' +
        (s.connected ? "Nothing abnormal in what is observable" : "Not connected — nothing has been observed") +
        '</span><span></span></div></div>';

    // A compact strip, not six equal boxes. Health is not a metric, and CPU is
    // permanently unavailable — both were cards, and CPU owned an entire row.
    const fs = frameStats(), mem = memEvent();
    const c = {}; state.events.forEach(e => c[e.category]=(c[e.category]||0)+1);
    const stale = (sub) => s.connected ? sub : sub + " · before the disconnect";
    const stat = (k,v,sub,none) => '<div class="stat"><div class="k">'+k+'</div><div class="v'+(none?' none':'')+'">'+v+'</div><div class="s">'+(sub||"")+'</div></div>';
    h += '<h2 class="sec">Session</h2><div class="block"><div class="stats">';
    h += stat("Events in view", state.events.length.toLocaleString(),
      (Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>k+" "+v).join(" · ") || "none captured") +
      (t ? " · store retains "+Object.values(t.retention.retained).reduce((a,b)=>a+b,0).toLocaleString() : ""));
    h += t ? stat("Tool calls", t.mcp.cost.calls.toLocaleString(),
        (t.mcp.cost.errors ? t.mcp.cost.errors+" failed" : "no errors") + " · " + fmtBytes(t.mcp.cost.responseBytes))
      : stat("Tool calls","unknown","no telemetry yet",true);
    // A count is only shown when the count is a measurement. With no runtime
    // attached nothing could have been counted, and printing 0 there is the
    // exact substitution of a zero for a missing reading that this rules out.
    const observed = (label, cat, n, sub) => n > 0
      ? stat(label, n.toLocaleString(), stale(sub))
      : stat(label, emptyKind(cat) === "0 observed" ? "0" : emptyKind(cat),
             emptyKind(cat) === "0 observed" ? "collector active and watching" : collectorWhy(cat),
             emptyKind(cat) !== "0 observed");
    h += observed("Exceptions", "exception", byCat("exception").length, "see Attention");
    h += fs ? stat("Frames in view", fs.n.toLocaleString(), stale(fs.janky+" over budget · p95 "+fs.p95.toFixed(1)+"ms"))
            : stat("Frames in view", s.connected ? "none yet" : "unavailable",
                s.connected ? "Flutter renders only on change" : "requires a connected app", true);
    h += mem ? stat("Heap", mem.data.heapUsageMB+" MB", stale("cap "+mem.data.heapCapacityMB+" MB"))
             : stat("Heap", s.connected ? "not sampled" : "unavailable",
                 s.connected ? "polled while this page is open" : "requires a connected app", true);
    h += observed("Network", "network", byCat("network").length, "requests observed");
    h += '</div></div>';

    const recent = activityModel().slice(0, 8);
    h += '<h2 class="sec">Recent activity <span class="hint">newest first</span></h2>';
    h += recent.length ? '<div class="block">' + recent.map(a => activityRow(a, false)).join("") + '</div>'
                       : '<div class="block"><div class="empty">No activity recorded yet.</div></div>';
    p.innerHTML = h;
    const go = (n) => {
      const a = att[Number(n.dataset.a)].action;
      if (a.filter) state.filter = a.filter;
      state.query = a.query != null ? a.query : "";
      state.cursor = null;
      setTab(a.tab, "push");
    };
    p.querySelectorAll(".fnd.clickable").forEach(n => {
      n.onclick = () => go(n);
      n.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(n); } };
    });
  }

  // ---- Activity ----------------------------------------------------------
  // One stream. Logs, Network, Exceptions, Timeline and the MCP call log were
  // five destinations the reader had to merge mentally; three of them rendered
  // the same empty sentence when the app was gone.
  const RETRY_RE = /^(Reconnecting in |Reconnect attempt \d+ failed)/;
  const HEAP_RE = /^Heap [\d.]+MB \/ cap /;

  /**
   * Collapse a consecutive run of rows into one, keeping the originals behind a
   * disclosure. Used for reconnect churn and for the dashboard's own heap
   * polling — both are runs of near-identical self-generated rows that push the
   * app's evidence off the screen.
   */
  function rollUp(out, test, summarise) {
    const rolled = [];
    for (let i = 0; i < out.length; i++) {
      if (!test(out[i])) { rolled.push(out[i]); continue; }
      let j = i;
      while (j < out.length && test(out[j])) j++;
      const run = out.slice(i, j);
      // A run of one or two is not a flood; collapsing it would hide more than
      // it saves and would cost a click to read two rows.
      if (run.length < 3) rolled.push(...run); else rolled.push(summarise(run));
      i = j - 1;
    }
    return rolled;
  }

  function activityModel(){
    const out = [];
    for (const e of state.events)
      out.push({ at: e.timestamp, src: e.category, sev: e.severity, label: e.message, ev: e, id: "ev-"+e.id });
    const t = state.telemetry;
    if (t) for (const c of t.mcp.cost.recent)
      out.push({ at: c.at, src: "mcp", sev: c.isError ? "error" : "info", label: c.tool,
                 meta: c.ms+"ms · "+fmtBytes(c.bytes), call: c, id: "mcp-"+c.at+"-"+c.tool });
    out.sort((a,b) => b.at - a.at);

    // Two runs of self-generated noise get collapsed, for the same reason:
    // eight reconnect attempts produced sixteen rows, and the heap poller
    // produced more rows than everything the app did combined.
    let rolled = rollUp(out,
      (r) => r.src === "system" && RETRY_RE.test(r.label),
      (run) => {
        const attempts = run.filter(r => /^Reconnect attempt/.test(r.label)).length;
        return { at: run[0].at, src: "system", sev: "warning",
          label: "Reconnect — " + attempts + " attempt" + (attempts===1?"":"s") + " failed over " + dur(run[0].at - run[run.length-1].at),
          meta: run.length + " rows", run, id: "run-"+run[run.length-1].at };
      });
    rolled = rollUp(rolled,
      (r) => r.src === "system" && HEAP_RE.test(r.label),
      (run) => ({ at: run[0].at, src: "system", sev: "info",
        label: "Heap sampled — " + run.length + " readings over " + dur(run[0].at - run[run.length-1].at),
        meta: run.length + " rows", run, id: "heap-"+run[run.length-1].at }));
    return rolled;
  }

  const FILTERS = [["all","All"],["app","App"],["mcp","MCP"],["system","System"],
                   ["toolfail","Tool failures"],["exception","Exceptions"],
                   ["log","Logs"],["network","Network"],["frame","Frames"]];

  /** Where the source-scope chips end and the category chips begin. */
  const SOURCE_FILTERS = 4;

  /** Human wording for each filter, used by the active-filter summary. */
  const FILTER_LABEL = Object.fromEntries(FILTERS);

  // "App" is what the observed application produced. It deliberately excludes
  // both MCP (the agent's own calls) and system (this server's notes and its
  // own heap polling), which together dominated every other view.
  const isApp = (a) => a.src !== "mcp" && a.src !== "system";

  function matchesFilter(a){
    switch(state.filter){
      case "all": return true;
      case "app": return isApp(a);
      case "mcp": return a.src === "mcp";
      case "system": return a.src === "system";
      // A tool call that returned an error. Not an app exception, and not a
      // slow frame — those have their own filters and mean different things.
      case "toolfail": return a.src === "mcp" && !!(a.call && a.call.isError);
      default: return a.src === state.filter;
    }
  }

  function activityRow(a, interactive = true){
    const open = state.expanded.has(a.id);
    const expandable = !!(a.ev || a.call || a.run);
    const control = interactive && expandable;
    let h = '<div class="arow sev-'+a.sev+(control ? ' clickable' : '')+'" data-x="'+a.id+'"' +
      (control ? ' role="button" tabindex="'+(a.id === state.cursor ? '0' : '-1')+
                 '" aria-expanded="'+(open ? 'true' : 'false')+'"' : '') + '>' +
      '<span class="ts">'+fmtTime(a.at)+'</span>' +
      '<span class="src">'+esc(a.src)+'</span>' +
      '<span class="msg">'+esc(a.label)+'</span>' +
      '<span class="meta">'+(a.meta ? esc(a.meta) : "")+'</span></div>';
    if (open && interactive) h += '<div class="detail">'+detailFor(a)+'</div>';
    return h;
  }

  function detailFor(a){
    if (a.run)
      return '<b>Every attempt, oldest first:</b>\n' +
        a.run.slice().reverse().map(r => "  " + fmtTime(r.at) + "  " + esc(r.label)).join("\n");
    if (a.call)
      return '<b>Tool:</b> ' + esc(a.call.tool) + '\n<b>Duration:</b> ' + a.call.ms + 'ms\n' +
        '<b>Response:</b> ' + fmtBytes(a.call.bytes) + '\n<b>Outcome:</b> ' + (a.call.isError ? 'error' : 'ok') +
        (a.call.isError ? '\n\nThe failure reason is not recorded per call, so this row cannot say why it failed.' : '');
    const d = a.ev.data || {};
    if (a.src === "network") {
      const code = d.statusCode;
      return (d.error ? '<b>Error:</b> '+esc(d.error)+"\n" : "") +
        '<b>Status:</b> '+(code||"—")+" "+esc(d.responseReason||"")+"\n" +
        '<b>Duration:</b> '+(d.durationMs!=null?d.durationMs+"ms":"—")+"\n" +
        '<b>Request headers:</b>\n'+esc(fmtHeaders(d.requestHeaders))+"\n" +
        '<b>Response headers:</b>\n'+esc(fmtHeaders(d.responseHeaders));
    }
    if (a.src === "exception")
      return (d.widget?'<b>Widget:</b> '+esc(d.widget)+"\n":"") + (d.library?'<b>Library:</b> '+esc(d.library)+"\n":"") +
        (d.type?'<b>Type:</b> '+esc(d.type)+"\n":"") + '<b>Stack trace:</b>\n' +
        (d.stackTrace?'<span class="stack">'+esc(d.stackTrace)+'</span>':"  (no stack captured)");
    const keys = Object.keys(d);
    return '<b>Source:</b> '+esc(a.ev.source)+'\n<b>Severity:</b> '+esc(a.ev.severity)+
      (keys.length ? '\n\n'+keys.map(k=>"  "+k+": "+esc(JSON.stringify(d[k]))).join("\n") : '\n\n  (no structured data)');
  }
  function fmtHeaders(h){ if(!h) return "  (fetched only for failed/slow requests)"; return Object.entries(h).map(([k,v])=>"  "+k+": "+v).join("\n")||"  (none)"; }

  function renderActivity(p){
    const model = activityModel();
    const total = model.length;
    let rows = model.filter(matchesFilter);
    if (state.query) { const q = state.query.toLowerCase(); rows = rows.filter(a => a.label.toLowerCase().includes(q)); }
    const shown = rows.slice(0, 400);

    let h = '<div class="filters">' +
      FILTERS.map(([k,label],i) => '<button class="fbtn'+(state.filter===k?' on':'')+(i===SOURCE_FILTERS?' group-2':'')+
        '" data-f="'+k+'" aria-pressed="'+(state.filter===k)+'">'+label+'</button>').join("") +
      '<input type="text" id="aq" aria-label="Search activity entries" placeholder="search…" value="'+esc(state.query)+'" />' +
      (state.query ? '<button id="aclear">clear</button>' : '') + '</div>';

    h += shown.length
      ? '<div class="block">' + shown.map(a => activityRow(a)).join("") + '</div>' +
        (rows.length > shown.length ? '<div class="note">Showing the newest '+shown.length+' of '+rows.length+' matching entries.</div>' : '')
      : '<div class="block"><div class="empty">' + activityEmpty() + '</div></div>';
    const narrowed = (state.filter !== "all") || !!state.query;
    if (narrowed)
      h += '<div class="note" id="fsum">Showing <b>'+esc(FILTER_LABEL[state.filter] || state.filter)+'</b>' +
        (state.query ? ' matching <b>'+esc(state.query)+'</b>' : '') +
        ' — '+rows.length.toLocaleString()+' of '+total.toLocaleString()+' entries. ' +
        '<button id="fclear">Clear filters</button></div>';

    const t = state.telemetry;
    if (t && state.filter === "mcp" && t.mcp.cost.calls > t.mcp.cost.recent.length)
      h += '<div class="note">Individual calls are kept for the most recent window only; <b>' +
           t.mcp.cost.calls.toLocaleString()+'</b> calls have been made this session in total. ' +
           'Diagnostics carries the full per-tool breakdown.</div>';

    // Only while pinned, and it says what arrived while you were reading.
    if (!state.following) {
      const fresh = state.followFrom ? rows.filter(a => a.at > state.followFrom).length : 0;
      h += '<div class="jump"><button id="jumpTop">' +
        (fresh ? fresh + " new " + (fresh === 1 ? "entry" : "entries") + " — jump to latest" : "Jump to latest") +
        '</button></div>';
    }
    p.innerHTML = h;

    const jt = p.querySelector("#jumpTop");
    if (jt) jt.onclick = () => { main.scrollTop = 0; state.following = true; state.followFrom = null; dirty = true; render(); };

    // A search set by a drill-through belongs to the view it drilled into.
    // Carrying it across a filter change hid every row and looked like an empty
    // category rather than an active filter.
    p.querySelectorAll(".fbtn").forEach(b => b.onclick = () => {
      state.filter = b.dataset.f; state.query = ""; state.cursor = null;
      syncUrl("replace"); dirty = true; render();
    });
    const q = p.querySelector("#aq");
    q.oninput = () => { state.query = q.value; syncUrl("replace"); dirty = true; render(); };
    const cl = p.querySelector("#aclear");
    if (cl) cl.onclick = () => { state.query = ""; syncUrl("replace"); dirty = true; render(); };
    const fc = p.querySelector("#fclear");
    if (fc) fc.onclick = () => {
      state.filter = "all"; state.query = ""; state.cursor = null;
      syncUrl("replace"); dirty = true; render();
    };
    const rowEls = [...p.querySelectorAll(".arow.clickable")];
    // Exactly one row is a tab stop. Keep the cursor on a row that still exists
    // after a re-render, otherwise the list becomes unreachable by keyboard.
    if (rowEls.length && !rowEls.some(r => r.dataset.x === state.cursor)) {
      state.cursor = rowEls[0].dataset.x;
      rowEls[0].tabIndex = 0;
    }
    const toggle = (id) => {
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      dirty = true; render();
    };
    rowEls.forEach(r => { r.onclick = () => { state.cursor = r.dataset.x; toggle(r.dataset.x); }; });

    const list = p.querySelector(".block");
    if (list) list.onkeydown = (e) => {
      const row = e.target.closest && e.target.closest(".arow.clickable");
      if (e.key === "Enter" || e.key === " ") {
        if (!row) return;
        e.preventDefault(); state.cursor = row.dataset.x; toggle(row.dataset.x);
        return;
      }
      const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
      if (step === undefined && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault();
      const here = rowEls.indexOf(row);
      const n = e.key === "Home" ? 0 : e.key === "End" ? rowEls.length - 1
              : Math.max(0, Math.min(rowEls.length - 1, (here < 0 ? 0 : here) + step));
      const target = rowEls[n];
      if (!target) return;
      rowEls.forEach(r => { r.tabIndex = -1; });
      target.tabIndex = 0; state.cursor = target.dataset.x;
      target.focus();
    };
  }

  function activityEmpty(){
    // Ahead of every category message: if the reader emptied the buffer, that
    // is the explanation, and it is the one that needs the reassurance.
    if (state.cleared && !state.events.length)
      return "<b>View cleared.</b> The server's store is untouched — reload to restore whatever it still retains.";
    if (state.query) return "No entries match <b>" + esc(state.query) + "</b>.";
    if (state.filter === "mcp") return "<b>No MCP tool calls yet.</b> The agent has not invoked a tool this session.";
    if (state.filter === "toolfail") return "<b>No failed tool calls.</b> Every MCP call this session returned successfully.";
    if (state.filter === "system") return "<b>No system events.</b> This server has not recorded a connection note or a heap sample yet.";
    if (state.filter === "app") return state.status.connected
      ? "<b>Nothing from the app yet.</b> Flutter emits no frames, logs or requests while it is idle. MCP and system entries are under their own filters."
      : "<b>Not connected.</b> Nothing has been observed from an app this session.";
    if (state.filter === "all") return state.status.connected
      ? "<b>Nothing yet.</b> Flutter emits no frames or logs while the app is idle."
      : "<b>Not connected.</b> Nothing has been observed this session.";
    const kind = emptyKind(state.filter), c = collectorFor(state.filter);
    if (kind === "unobservable on this target")
      return "<b>Unobservable on this target.</b><br/>" + esc(c.detail||"") +
             "<br/>An empty view here is a blind spot, not a clean result.";
    if (kind === "partially observable")
      return "<b>Partially observable.</b><br/>" + esc(c.detail||"") + "<br/>Some events may never arrive.";
    if (kind === "not connected") return "<b>Not connected.</b> Nothing has been observed this session.";
    return "<b>0 observed.</b> The collector is active and watching.";
  }

  // ---- Performance -------------------------------------------------------
  function renderPerformance(p){
    const fs = frameStats();
    let h = '<h2 class="sec">Frame timing</h2>';
    if (!fs) {
      h += '<div class="block"><div class="empty">' +
        (state.status.connected
          ? "<b>No frames observed.</b><br/>Flutter renders only when something changes, so an idle app is silent here — this is not a stall."
          : "<b>Not connected.</b><br/>Frame timing requires an attached app.") + '</div></div>';
      p.innerHTML = h; return;
    }
    const stat = (k,v,sub) => '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+(sub||"")+'</div></div>';
    h += '<div class="block"><div class="stats">' +
      stat("Frames", fs.n.toLocaleString(), "held in this browser's buffer") +
      stat("p50", fs.p50.toFixed(1)+"ms") + stat("p95", fs.p95.toFixed(1)+"ms") +
      stat("p99", fs.p99.toFixed(1)+"ms") + stat("Max", fs.max.toFixed(1)+"ms") +
      stat("Over budget", fs.janky, Math.round(fs.janky/fs.n*100)+"% of frames") +
      '</div></div>';
    h += '<div class="note">Budget is a fixed <b>'+JANK_BUDGET_MS+'ms</b> (60fps), applied by the frame collector.' +
      (fs.p50 < 10 ? ' This target\'s median frame is <b>'+fs.p50.toFixed(1)+'ms</b>, which suggests a display faster than 60Hz — against its real budget more frames would count as late, so the figure above is conservative.' : '') +
      '</div>';

    h += '<h2 class="sec">Frame time <span class="hint">last 120 frames · dashed line marks the '+JANK_BUDGET_MS+'ms budget</span></h2>' +
      '<canvas id="frameChart"></canvas>';
    h += '<h2 class="sec">Heap <span class="hint">sampled while this page is open</span></h2><canvas id="memChart"></canvas>';

    h += '<h2 class="sec">Worst frames</h2><div class="block"><div class="scroll-x"><table class="tbl">' +
      '<thead><tr><th scope="col">Frame</th><th scope="col" class="num">Total</th><th scope="col" class="num">Build</th><th scope="col" class="num">Raster</th><th scope="col">When</th><th scope="col"><span class="sr-only">Drill through</span></th></tr></thead><tbody>' +
      fs.worst.map(e => '<tr class="clickable" data-f="'+esc("Frame #"+(e.data.number!=null?e.data.number:""))+'">' +
        '<td class="name">#'+(e.data.number!=null?e.data.number:"?")+'</td>' +
        '<td class="num'+(isJanky(e)?' bad':'')+'">'+e.data.elapsedMs.toFixed(1)+'ms</td>' +
        '<td class="num">'+(e.data.buildMs!=null?e.data.buildMs.toFixed(1)+"ms":"—")+'</td>' +
        '<td class="num">'+(e.data.rasterMs!=null?e.data.rasterMs.toFixed(1)+"ms":"—")+'</td>' +
        '<td>'+fmtTime(e.timestamp)+'</td><td><button class="lnk">Activity →</button></td></tr>').join("") +
      '</tbody></table></div></div>';
    p.innerHTML = h;

    drawChart(p.querySelector("#frameChart"), byCat("frame").slice(-120).map(e=>e.data.elapsedMs||0), { budget: JANK_BUDGET_MS, color: "#58a6ff" });
    drawChart(p.querySelector("#memChart"), byCat("system").filter(e=>e.data&&e.data.heapUsageMB!=null).slice(-120).map(e=>e.data.heapUsageMB), { color: "#3fb950" });
    p.querySelectorAll("tr.clickable").forEach(r => {
      const go = () => { state.filter = "frame"; state.query = r.dataset.f; state.cursor = null; setTab("Activity", "push"); };
      r.onclick = go;
      const b = r.querySelector("button.lnk");
      if (b) { b.onclick = (e) => { e.stopPropagation(); go(); };
               b.setAttribute("aria-label", "Show " + r.dataset.f + " in Activity"); }
    });
  }

  function drawChart(cv, data, opts){
    const dpr = window.devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w*dpr; cv.height = h*dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    ctx.font = "11px ui-monospace, monospace";
    if(!data.length){ ctx.fillStyle="#8b949e"; ctx.fillText("no data yet", 12, 24); return; }
    // Two different quantities that were previously one variable: what the data
    // actually reached, and how tall the drawing area is.
    const observedMax = Math.max(...data);
    const max = Math.max(opts.budget||0, observedMax)*1.15 || 1, pad = 10;
    const x = i => pad + (i/(Math.max(data.length-1,1)))*(w-2*pad);
    const y = v => h-pad - (v/max)*(h-2*pad);
    if(opts.budget){ ctx.strokeStyle="rgba(248,81,73,.5)"; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(pad,y(opts.budget)); ctx.lineTo(w-pad,y(opts.budget)); ctx.stroke(); ctx.setLineDash([]); }
    ctx.strokeStyle = opts.color; ctx.lineWidth = 1.5; ctx.beginPath();
    data.forEach((v,i)=>{ i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)); }); ctx.stroke();
    ctx.fillStyle = "#8b949e";
    ctx.fillText("max " + observedMax.toFixed(1) + " · last " + (data[data.length-1]||0).toFixed(1) +
                 "  (" + data.length + " samples)", pad, 16);
  }

  // ---- Diagnostics -------------------------------------------------------
  // Topology, subsystem health, what this build can inspect, and what nothing
  // here can see. Every status is derived from reported state; none is drawn.
  const COLL_STATE = { active: ["ok","ACTIVE"], degraded: ["warn","DEGRADED"], unavailable: ["na","UNAVAILABLE"] };

  function renderDiagnostics(p){
    const s = state.status, t = state.telemetry, sys = systemState();
    const row = (n, x, w) => '<div class="srow"><span class="n">'+n+'</span>'+st(x.cls,x.label)+'<span class="w">'+(w!=null?w:x.why)+'</span></div>';
    let h = '';

    h += '<h2 class="sec">Topology <span class="hint">measured, not assumed</span></h2><div class="block">';
    h += row("Flutter app", sys.runtime);
    h += row("↳ VM Service", sys.vm);
    h += row("↳ Collectors", s.connected ? {cls:"ok",label:"SUBSCRIBED"} : {cls:"idle",label:"IDLE"},
      s.connected ? "attached to the isolate's streams"
                  : "no runtime attached — the health below is the last value each collector reported");
    h += t ? row("Runtime store", {cls:"ok",label:"ACTIVE"},
        Object.values(t.retention.retained).reduce((a,b)=>a+b,0).toLocaleString()+" events retained · " +
        (Object.values(t.retention.evicted).reduce((a,b)=>a+b,0) || "none")+" evicted" +
        (t.retention.oldestEventMs ? " · oldest "+ago(t.retention.oldestEventMs) : ""))
      : row("Runtime store", {cls:"idle",label:"UNKNOWN"}, "no telemetry yet");
    h += row("↳ MCP tools", sys.mcp, "read the same store directly — one process, no bridge between them");
    h += row("↳ Dashboard stream", sys.stream);
    h += '</div>';

    h += '<h2 class="sec">MCP</h2><div class="block">';
    h += row("Server process", sys.mcp);
    h += row("Agent connection", sys.agent);
    h += row("Runtime dependency", s.connected ? {cls:"ok",label:"AVAILABLE"} : {cls:"na",label:"UNAVAILABLE"},
      s.connected ? "tools that read the app can reach it" : "tools that read the app cannot reach it");
    h += row("Tool execution", sys.tools);
    h += '</div>';

    const part = toolPartition();
    if (part) {
      h += '<div class="block" style="margin-top:var(--s3)"><div class="scroll-x"><table class="tbl">' +
        '<thead><tr><th scope="col">Tool</th><th scope="col" class="num">Calls</th><th scope="col" class="num">Errors</th><th scope="col" class="num">Avg</th>' +
        '<th scope="col" class="num">Slowest</th><th scope="col" class="num">Response</th><th scope="col">Last</th><th scope="col"><span class="sr-only">Drill through</span></th></tr></thead><tbody>' +
        t.mcp.cost.byTool.map(r => '<tr class="clickable" data-t="'+esc(r.tool)+'"><td class="name">'+esc(r.tool)+'</td>' +
          '<td class="num">'+r.calls+'</td>' +
          '<td class="num '+(r.errors?'bad':'good')+'">'+r.errors+'</td>' +
          '<td class="num">'+Math.round(r.totalMs/r.calls)+'ms</td><td class="num">'+r.slowestMs+'ms</td>' +
          '<td class="num">'+fmtBytes(r.bytes)+'</td><td>'+ago(r.lastAt)+'</td>' +
          '<td><button class="lnk">Activity →</button></td></tr>').join("") +
        '</tbody></table></div></div>';
      if (part.clean.length && part.failing.length)
        h += '<div class="note">The split is exact: <b>'+part.clean.length+'</b> tool'+(part.clean.length>1?'s':'')+
          ' never failed across '+part.cleanCalls+' calls, while <b>'+part.failing.length+'</b> runtime-dependent tool'+
          (part.failing.length>1?'s':'')+' account for every one of the '+part.errors+' failures. ' +
          'The per-call failure reason is not recorded, so this is a correlation rather than a proven cause.</div>';
    }

    h += '<h2 class="sec">Collectors</h2><div class="block">';
    if (!t) h += '<div class="empty">No telemetry received yet.</div>';
    else h += t.collectors.map(c => {
      const [cls, label] = s.connected ? (COLL_STATE[c.status] || ["idle", String(c.status).toUpperCase()])
                                       : ["idle", "IDLE"];
      const why = (!s.connected ? "no runtime attached · " : (c.detail ? esc(c.detail)+" · " : "")) +
        c.eventsRetained.toLocaleString()+" retained in the store" + (c.lastEventMs ? " · last "+ago(c.lastEventMs) : " · none seen");
      return '<div class="srow"><span class="n">'+esc(c.name)+'</span>'+st(cls,label)+'<span class="w">'+why+'</span></div>';
    }).join("");
    h += '</div>';

    // Inspector folded in: it was a capability list, which is what this page is.
    h += '<h2 class="sec">Inspection <span class="hint">pull-based — nothing streams a widget tree</span></h2><div class="block">';
    const called = (n) => t && t.mcp.cost.byTool.find(x => x.tool === n);
    const wt = called("get_widget_tree"), sel = called("get_selected_widget");
    const pullRow = (name, tool, rec) => row(name, s.connected ? {cls:"warn",label:"PULL ONLY"} : {cls:"na",label:"UNAVAILABLE"},
      s.connected ? "MCP <code>"+tool+"</code> — " + (rec ? rec.calls+" call"+(rec.calls>1?"s":"")+" this session, last "+ago(rec.lastAt)
                                                          : "not called this session")
                  : "requires a connected app in a debug build");
    h += pullRow("Widget tree", "get_widget_tree", wt);
    h += pullRow("Selected widget", "get_selected_widget", sel);
    h += row("Live tree stream", {cls:"na",label:"NOT IMPLEMENTED"},
      "no VM Service stream pushes widget trees; a live view would have to poll, and nothing does");
    h += '</div>';

    h += '<h2 class="sec">Not observable <span class="hint">stated, so an empty view is never mistaken for a clean one</span></h2><div class="block">';
    h += row("CPU", {cls:"na",label:"UNAVAILABLE"}, "the Dart VM Service does not sample it");
    h += row("Other MCP clients", {cls:"na",label:"UNAVAILABLE"},
      "the transport is stdio: exactly one peer, the process that spawned this one. A second agent would be a second server with its own store.");
    h += row("Agent behaviour", {cls:"na",label:"UNAVAILABLE"},
      "tool calls are counted; what the model concluded from a result never reaches this process");
    h += row("Causality", {cls:"na",label:"UNAVAILABLE"},
      "events carry time, not cause. Adjacency is measured; anything stated as a cause elsewhere is labelled as inferred.");
    h += '</div>';

    if (t && t.unobservable.length)
      h += '<div class="note">Empty because nothing could see them, not because nothing happened: <b>' +
        t.unobservable.map(esc).join(", ") + '</b>.</div>';
    p.innerHTML = h;
    p.querySelectorAll("tr.clickable").forEach(r => {
      const go = () => { state.filter = "mcp"; state.query = r.dataset.t; state.cursor = null; setTab("Activity", "push"); };
      r.onclick = go;
      const b = r.querySelector("button.lnk");
      if (b) { b.onclick = (e) => { e.stopPropagation(); go(); };
               b.setAttribute("aria-label", "Show " + r.dataset.t + " calls in Activity"); }
    });
  }

  // ---- boot ----
  setTab(applyUrl(), "replace"); connect();
})();
</script>
</body>
</html>
